<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="Nghi duong cao cap">
  <!-- Minh hoa danh muc "Du lich nghi duong cao cap" -->
  <defs>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A3833"/>
      <stop offset="52%" stop-color="#C2622D"/>
      <stop offset="100%" stop-color="#E0A458"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4EAF9D"/>
      <stop offset="100%" stop-color="#12655B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyR)"/>

  <!-- Mat troi -->
  <circle cx="400" cy="286" r="72" fill="#F9EBD6" opacity=".82"/>

  <!-- Duong chan troi bien -->
  <rect y="330" width="800" height="54" fill="#0E4F47" opacity=".8"/>
  <path d="M340 330h120l30 54H310z" fill="#F9EBD6" opacity=".18"/>

