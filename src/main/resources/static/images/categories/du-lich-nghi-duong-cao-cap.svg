  <g stroke="#5E2A10" stroke-width="3" opacity=".55">
    <line x1="0" y1="536" x2="800" y2="536"/>
    <line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="584" x2="800" y2="584"/>
