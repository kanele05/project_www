    <linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A3833"/>
      <stop offset="60%" stop-color="#2A6E5E"/>
      <stop offset="100%" stop-color="#E0A458"/>
