<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
     role="img" aria-label="Nui rung">
  <!-- Minh hoa danh muc "Du lich nui rung" - xem chu thich o du-lich-bien-dao.svg -->
