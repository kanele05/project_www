
spring:
  application:
    name: tourbooking

  profiles:
    default: dev

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TourBookingDB;encrypt=true;trustServerCertificate=true;loginTimeout=30
    username: tourapp
    password: Tour@2026#IUH
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      pool-name: TourBookingHikariPool

  jpa:
    hibernate:

      ddl-auto: validate

    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        format_sql: true

        use_nationalized_character_data: true

        validator:
          apply_to_ddl: false
        jdbc:
          batch_size: 20
        default_batch_fetch_size: 20

  thymeleaf:
    encoding: UTF-8
    cache: false

  messages:
    basename: messages
    encoding: UTF-8

    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s

  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    retry:
      max-attempts: 3
      on-http-codes: 429
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 15s
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${app.ai.base-url}
      chat:
        completions-path: ${app.ai.chat-path}
        options:
          model: ${app.ai.chat-model}
          temperature: 0.3
      embedding:
        embeddings-path: ${app.ai.embeddings-path}
        options:
          model: ${app.ai.embedding-model}
          dimensions: ${app.ai.embedding-dimensions:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  upload:

    dir: ${user.dir}/uploads
    url-prefix: /uploads
  mail:
    mode: console
    from: ${MAIL_FROM:khanglehoang2602@gmail.com}
    from-name: IUH Tour Booking

  ai:
    enabled: ${AI_ENABLED:}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com}
    chat-path: ${AI_CHAT_PATH:/v1beta/openai/chat/completions}
    embeddings-path: ${AI_EMBEDDINGS_PATH:/v1beta/openai/embeddings}
    chat-model: ${AI_CHAT_MODEL:gemini-2.5-flash}
    embedding-model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:}
    embedding-min-interval-ms: ${AI_EMBEDDING_MIN_INTERVAL_MS:700}
    vector-store-path: ${AI_VECTOR_STORE_PATH:data/vector-store.json}
    similarity-threshold: ${AI_SIMILARITY_THRESHOLD:0.5}
    search-top-k: 30
    rag-top-k: 4
    memory-messages: 20
    chat-per-minute: 8
    max-message-length: 500

  tracking:
    enabled: true
    max-events-per-minute: 60
    min-duration-ms: 500
    max-duration-ms: 1800000
    retention-days: 180

  booking:

    cutoff-days: 2

    pending-expiry-hours: 24

    self-cancel-min-days: 3

    full-refund-min-days: 7

    partial-refund-percent: 50

server:

  port: ${PORT:8081}
  error:

    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    vn.edu.iuh.fit.tourbooking: DEBUG

  charset:
    console: UTF-8
    file: UTF-8
