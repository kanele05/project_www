
spring:
  application:
    name: tourbooking

  profiles:
    default: dev

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=TourBookingDB;encrypt=true;trustServerCertificate=true;loginTimeout=30
    username: tourapp
    password: Tour@2026#IUH
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      pool-name: TourBookingHikariPool

  jpa:
    hibernate:

      ddl-auto: validate

    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    properties:
      hibernate:
        format_sql: true

        use_nationalized_character_data: true

        validator:
          apply_to_ddl: false
        jdbc:
          batch_size: 20
        default_batch_fetch_size: 20

  thymeleaf:
    encoding: UTF-8
    cache: false

  messages:
    basename: messages
    encoding: UTF-8

    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  upload:

    dir: ${user.dir}/uploads
    url-prefix: /uploads
  mail:
    mode: console
    from: ${MAIL_FROM:khanglehoang2602@gmail.com}
    from-name: IUH Tour Booking

  booking:

    cutoff-days: 2

    pending-expiry-hours: 24

    self-cancel-min-days: 3

    full-refund-min-days: 7

    partial-refund-percent: 50

server:

  port: ${PORT:8081}
  error:

    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    vn.edu.iuh.fit.tourbooking: DEBUG

  charset:
    console: UTF-8
    file: UTF-8
