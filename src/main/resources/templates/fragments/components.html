<!DOCTYPE html>

<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i> <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${errorMessage}">Có lỗi</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
</div>

<div th:fragment="sectionHead(eyebrow, title, lead)" class="mb-4 mb-lg-5 reveal">
    <span class="eyebrow" th:if="${eyebrow != null and !eyebrow.isEmpty()}"
          th:text="${eyebrow}">Nhãn</span>
    <h2 class="section-title" th:text="${title}">Tiêu đề</h2>
    <p class="section-lead mb-0" th:if="${lead != null and !lead.isEmpty()}" th:text="${lead}">Câu dẫn</p>
</div>

<div th:fragment="tourArt(tour)" class="tour-art"
     th:classappend="'art-' + ${tour.artVariant}">
    <span class="tour-art__label" th:text="${tour.destination}">Điểm đến</span>
</div>

<nav th:fragment="pagination(page, urlPrefix)" th:if="${page.totalPages > 1}"
     aria-label="Phân trang" class="mt-5">
    <ul class="pagination justify-content-center"
        th:with="start=${page.number - 2 < 0 ? 0 : page.number - 2},
                 end=${page.number + 2 > page.totalPages - 1 ? page.totalPages - 1 : page.number + 2}">

        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" aria-label="Trang trước"
               th:href="${page.first} ? '#' : @{|${urlPrefix}page=${page.number - 1}|}"
               th:aria-disabled="${page.first}"><i class="bi bi-chevron-left"></i></a>
        </li>

        <li th:each="i : ${#numbers.sequence(start, end)}"
            class="page-item" th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{|${urlPrefix}page=${i}|}" th:text="${i + 1}">1</a>
        </li>

        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" aria-label="Trang sau"
               th:href="${page.last} ? '#' : @{|${urlPrefix}page=${page.number + 1}|}"
               th:aria-disabled="${page.last}"><i class="bi bi-chevron-right"></i></a>
        </li>
    </ul>
</nav>

<div th:fragment="tourCard(tour)" class="col-12 col-sm-6 col-lg-4 reveal">
    <article class="tour-card">

        <div class="tour-card__media">
            <a th:href="@{/tours/{id}/{slug}(id=${tour.id}, slug=${tour.slug})}"
               th:aria-label="${tour.name}">

                <img th:if="${tour.thumbnail != null}"
                     th:src="${tour.thumbnail.startsWith('/')} ? ${tour.thumbnail} : @{'/uploads/' + ${tour.thumbnail}}"
                     th:alt="${tour.name}" loading="lazy">

                <th:block th:unless="${tour.thumbnail != null}">
                    <div th:replace="~{fragments/components :: tourArt(${tour})}"></div>
                </th:block>
            </a>

            <span class="tour-card__chip"
                  th:text="#{common.durationText(${tour.durationDays}, ${tour.durationNights})}">3 ngày 2 đêm</span>

            <span th:if="${tour.featured}" class="tour-card__chip tour-card__chip--featured">
                <i class="bi bi-star-fill"></i>
            </span>
        </div>

        <div class="tour-card__body">
            <p class="tour-card__cat mb-0" th:text="${tour.category.name}">Danh mục</p>

            <h3 class="tour-card__title">
                <a th:href="@{/tours/{id}/{slug}(id=${tour.id}, slug=${tour.slug})}"
                   th:text="${tour.name}">Tên tour</a>
            </h3>

            <p class="tour-card__desc" th:text="${tour.shortDescription}">Mô tả ngắn</p>

            <div class="tour-card__meta">
                <span><i class="bi bi-geo-alt"></i><span th:text="${tour.destination}">Điểm đến</span></span>
                <span><i class="bi bi-bus-front"></i><span th:text="${tour.transportation}">Phương tiện</span></span>
            </div>

            <div class="tour-card__foot">
                <div>
                    <span class="tour-card__price-label" th:text="#{common.from}">Từ</span>
                    <span class="tour-card__price"
                          th:text="|${#numbers.formatInteger(tour.basePrice, 1, 'POINT')} ${#messages.msg('common.currency')}|">
                        0 ₫
                    </span>
                </div>

                <form th:action="@{/cart/add}" method="post" data-ajax-cart>
                    <input type="hidden" name="tourId" th:value="${tour.id}">
                    <input type="hidden" name="numAdults" value="1">
                    <input type="hidden" name="numChildren" value="0">
                    <button class="btn btn-primary btn-sm" type="submit"
                            th:title="#{common.book}" th:aria-label="#{common.book}">
                        <i class="bi bi-bag-plus"></i>
                    </button>
                </form>
            </div>
        </div>
    </article>
</div>

</body>
</html>
