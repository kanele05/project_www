<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.password.title})}"></head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout :: header(false)}"></header>

<main class="container my-4 flex-grow-1">
    <h1 class="h3 mb-3" th:text="#{account.title}">Tài khoản của tôi</h1>

    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{fragments/account-nav :: accountNav('password')}"></div>
        </div>

        <div class="col-lg-9">
            <div th:replace="~{fragments/components :: alerts}"></div>

            <div class="panel">
                <div class="panel__pad">
                    <h2 class="h5 mb-3" th:text="#{account.password.title}">Đổi mật khẩu</h2>

                    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="currentPassword"
                                   th:text="#{account.password.current}">Mật khẩu hiện tại</label>
                            <input class="form-control" type="password" id="currentPassword"
                                   th:field="*{currentPassword}" th:errorclass="is-invalid"
                                   autocomplete="current-password" required>
                            <div class="invalid-feedback" th:errors="*{currentPassword}">Lỗi</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="newPassword"
                                   th:text="#{account.password.new}">Mật khẩu mới</label>
                            <input class="form-control" type="password" id="newPassword"
                                   th:field="*{newPassword}" th:errorclass="is-invalid"
                                   autocomplete="new-password" required>
                            <div class="invalid-feedback" th:errors="*{newPassword}">Lỗi</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="confirmPassword"
                                   th:text="#{account.password.confirm}">Nhập lại mật khẩu mới</label>
                            <input class="form-control" type="password" id="confirmPassword"
                                   th:field="*{confirmPassword}" th:errorclass="is-invalid"
                                   autocomplete="new-password" required>
                            <div class="invalid-feedback" th:errors="*{confirmPassword}">Lỗi</div>
                        </div>

                        <button class="btn btn-primary" type="submit"
                                th:text="#{account.password.submit}">Đổi mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
