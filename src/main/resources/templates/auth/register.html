<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{auth.register.title})}"></head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout :: header(false)}"></header>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="panel">
                <div class="panel__pad">

                    <h1 class="h4 mb-4 text-center">
                        <i class="bi bi-person-plus"></i>
                        <span th:text="#{auth.register.title}">Tạo tài khoản</span>
                    </h1>

                    <!--
                      th:object gắn biểu mẫu với đối tượng RegisterForm, nhờ vậy
                      th:field="*{...}" tự lo cả ba việc: đặt id, đặt name và điền
                      lại giá trị người dùng vừa nhập khi biểu mẫu bị trả về vì lỗi.
                      th:errorclass thêm lớp is-invalid của Bootstrap khi ô đó sai.
                    -->
                    <form th:action="@{/register}" th:object="${registerForm}" method="post">

                        <div class="mb-3">
                            <label class="form-label" for="fullName"
                                   th:text="#{auth.register.fullName}">Họ và tên</label>
                            <input class="form-control" type="text" id="fullName"
                                   th:field="*{fullName}" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{fullName}">Lỗi</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="email"
                                   th:text="#{auth.register.email}">Email</label>
                            <!--/*
                              data-check-email bật phần hỏi máy chủ ngay khi rời ô
                              (app.js gọi /api/users/email-available). Chỉ là tiện ích:
                              việc chặn thật vẫn do @UniqueEmail lo lúc gửi biểu mẫu.
                            */-->
                            <input class="form-control" type="email" id="email"
                                   th:field="*{email}" th:errorclass="is-invalid"
                                   autocomplete="username" data-check-email required>
                            <div class="invalid-feedback" th:errors="*{email}">Lỗi</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="password"
                                       th:text="#{auth.register.password}">Mật khẩu</label>
                                <input class="form-control" type="password" id="password"
                                       th:field="*{password}" th:errorclass="is-invalid"
                                       autocomplete="new-password" required>
                                <div class="invalid-feedback" th:errors="*{password}">Lỗi</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="confirmPassword"
                                       th:text="#{auth.register.confirmPassword}">Nhập lại</label>
                                <input class="form-control" type="password" id="confirmPassword"
                                       th:field="*{confirmPassword}" th:errorclass="is-invalid"
                                       autocomplete="new-password" required>
                                <div class="invalid-feedback" th:errors="*{confirmPassword}">Lỗi</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phone"
                                   th:text="#{auth.register.phone}">Số điện thoại</label>
                            <input class="form-control" type="tel" id="phone"
                                   th:field="*{phone}" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{phone}">Lỗi</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="address"
                                   th:text="#{auth.register.address}">Địa chỉ</label>
                            <input class="form-control" type="text" id="address"
                                   th:field="*{address}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{address}">Lỗi</div>
                        </div>

                        <button class="btn btn-primary w-100" type="submit"
                                th:text="#{auth.register.submit}">Đăng ký</button>
                    </form>

                    <p class="text-center small text-muted mt-3 mb-0">
                        <span th:text="#{auth.register.hasAccount}">Đã có tài khoản?</span>
                        <a th:href="@{/login}" th:text="#{nav.login}">Đăng nhập</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
