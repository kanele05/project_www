<!DOCTYPE html>

<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chào mừng bạn</title>
</head>
<body style="margin:0; padding:24px; background-color:#f4f5f7;
             font-family:Arial, Helvetica, sans-serif; color:#212529;">

<table role="presentation" cellpadding="0" cellspacing="0" width="100%"
       style="max-width:640px; margin:0 auto; background-color:#ffffff;
              border-radius:8px; overflow:hidden;">

    <tr>
        <td style="background-color:#0A3833; color:#ffffff; padding:20px 24px;">
            <h1 style="margin:0; font-size:20px;">IUH Tour Booking</h1>
        </td>
    </tr>

    <tr>
        <td style="padding:24px;">

            <p style="margin:0 0 12px;"
               th:text="#{email.welcome.greeting(${fullName})}">Xin chào,</p>
            <p style="margin:0 0 20px;"
               th:text="#{email.welcome.intro}">Cảm ơn bạn đã đăng ký tài khoản.</p>

            <table role="presentation" cellpadding="8" cellspacing="0" width="100%"
                   style="background-color:#f8f9fa; border-radius:6px; margin-bottom:20px;">
                <tr>
                    <td style="color:#6c757d; width:35%;" th:text="#{email.welcome.accountInfo}">Thông tin tài khoản</td>
                    <td></td>
                </tr>
                <tr>
                    <td style="color:#6c757d;" th:text="#{email.welcome.email}">Email đăng nhập</td>
                    <td style="font-weight:bold;" th:text="${email}">email@vidu.vn</td>
                </tr>
            </table>

            <p style="margin:0 0 16px;" th:text="#{email.welcome.cta}">Đăng nhập ngay để bắt đầu.</p>
            <p style="margin:0 0 16px;" th:text="#{email.welcome.outro}">Chúng tôi luôn sẵn sàng hỗ trợ.</p>
            <p style="margin:0; color:#6c757d;" th:text="#{email.welcome.signature}">Đội ngũ IUH Tour Booking</p>
        </td>
    </tr>

    <tr>
        <td style="background-color:#212529; color:#adb5bd; padding:16px 24px; font-size:12px;">
            <span th:text="#{app.footer.rights}">Đồ án môn học</span>
        </td>
    </tr>
</table>

</body>
</html>
