<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-layout :: head(${categoryForm.id} != null
                    ? #{admin.category.formTitleEdit} : #{admin.category.formTitleNew})}"></head>
<body>

<nav th:replace="~{admin/fragments/admin-layout :: topbar}"></nav>

<div class="admin-shell">
    <div class="admin-grid">
        <aside class="admin-aside">
            <div th:replace="~{admin/fragments/admin-layout :: sidebar('categories')}"></div>
        </aside>

        <main class="admin-main">

            <h1 class="h4 mb-3"
                th:text="${categoryForm.id} != null
                         ? #{admin.category.formTitleEdit} : #{admin.category.formTitleNew}">
                Thêm danh mục
            </h1>

            <div th:replace="~{fragments/components :: alerts}"></div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-body">
                            <form th:action="@{/admin/categories/save}" th:object="${categoryForm}"
                                  method="post" enctype="multipart/form-data">

                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label class="form-label" for="name"
                                           th:text="#{admin.category.name}">Tên danh mục</label>
                                    <input class="form-control" type="text" id="name"
                                           th:field="*{name}" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{name}">Lỗi</div>

                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="description"
                                           th:text="#{admin.category.description}">Mô tả</label>
                                    <textarea class="form-control" id="description" rows="3"
                                              th:field="*{description}" th:errorclass="is-invalid"></textarea>
                                    <div class="invalid-feedback" th:errors="*{description}">Lỗi</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="imageFile"
                                           th:text="#{admin.category.image}">Ảnh minh hoạ</label>
                                    <img th:if="*{currentImageUrl} != null"
                                         class="img-fluid rounded mb-2 d-block admin-preview-img"
                                         th:src="*{currentImageUrl.startsWith('/')}
                                                 ? *{currentImageUrl}
                                                 : @{'/uploads/' + *{currentImageUrl}}" alt="">
                                    <input class="form-control form-control-sm" type="file" id="imageFile"
                                           th:field="*{imageFile}"
                                           accept="image/jpeg,image/png,image/webp">
                                    <p class="small text-muted mb-0" th:text="#{admin.tour.uploadHint}">Gợi ý</p>
                                </div>

                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="active"
                                           th:field="*{active}">
                                    <label class="form-check-label" for="active"
                                           th:text="#{admin.category.active}">Đang hiển thị</label>
                                </div>

                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-check-lg"></i>
                                    <span th:text="#{admin.action.save}">Lưu</span>
                                </button>
                                <a class="btn btn-link text-decoration-none"
                                   th:href="@{/admin/categories}" th:text="#{admin.action.cancel}">Huỷ</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{admin/fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
