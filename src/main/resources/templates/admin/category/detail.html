<!DOCTYPE html>

<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-layout :: head(${detail.category.name})}"></head>
<body>

<nav th:replace="~{admin/fragments/admin-layout :: topbar}"></nav>

<div class="admin-shell">
    <div class="admin-grid">
        <aside class="admin-aside">
            <div th:replace="~{admin/fragments/admin-layout :: sidebar('categories')}"></div>
        </aside>

        <main class="admin-main">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item">
                        <a th:href="@{/admin/categories}" th:text="#{admin.category.title}">Quản lý danh mục</a>
                    </li>
                    <li class="breadcrumb-item active" th:text="${detail.category.name}">Tên danh mục</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 mb-0" th:text="${detail.category.name}">Tên danh mục</h1>
                <a class="btn btn-primary btn-sm" th:href="@{/admin/categories/form(id=${detail.category.id})}">
                    <i class="bi bi-pencil"></i> <span th:text="#{admin.action.edit}">Sửa</span>
                </a>
            </div>

            <div th:replace="~{fragments/components :: alerts}"></div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card mb-4">
                        <img th:if="${detail.category.imageUrl != null}" class="card-img-top"
                             style="height:160px;object-fit:cover"
                             th:src="${detail.category.imageUrl.startsWith('/')} ? ${detail.category.imageUrl} : @{'/uploads/' + ${detail.category.imageUrl}}"
                             th:alt="${detail.category.name}">
                        <div class="card-body">
                            <dl class="row small mb-0">
                                <dt class="col-5" th:text="#{admin.category.slug}">Đường dẫn</dt>
                                <dd class="col-7 text-break" th:text="${detail.category.slug}">slug</dd>

                                <dt class="col-5" th:text="#{admin.category.active}">Đang hiển thị</dt>
                                <dd class="col-7">
                                    <span class="badge"
                                          th:classappend="${detail.category.active} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${detail.category.active} ? #{admin.status.active} : #{admin.status.inactive}">
                                        Trạng thái
                                    </span>
                                </dd>

                                <dt class="col-5" th:text="#{admin.category.detail.tourCount}">Số tour</dt>
                                <dd class="col-7 fw-semibold" th:text="${#lists.size(detail.tours)}">0</dd>

                                <dt class="col-5" th:text="#{admin.category.description}"
                                    th:if="${detail.category.description}">Mô tả</dt>
                                <dd class="col-7 mb-0" th:if="${detail.category.description}"
                                    th:text="${detail.category.description}">Mô tả</dd>
                            </dl>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="h6 mb-3" th:text="#{admin.category.detail.tours}">Tour thuộc danh mục</h2>

                            <p th:if="${#lists.isEmpty(detail.tours)}" class="text-muted small mb-0"
                               th:text="#{admin.empty}">Chưa có dữ liệu.</p>

                            <div class="table-responsive" th:unless="${#lists.isEmpty(detail.tours)}">
                                <table class="table table-sm table-hover align-middle mb-0">
                                    <thead class="table-light">
                                    <tr>
                                        <th th:text="#{admin.tour.code}">Mã</th>
                                        <th th:text="#{admin.tour.name}">Tên tour</th>
                                        <th class="text-end" th:text="#{admin.tour.basePrice}">Giá</th>
                                        <th th:text="#{admin.tour.active}">Trạng thái</th>
                                        <th class="text-end">&nbsp;</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="t : ${detail.tours}">
                                        <td class="small fw-semibold" th:text="${t.code}">MÃ</td>
                                        <td th:text="${t.name}">Tên tour</td>
                                        <td class="text-end small"
                                            th:text="|${#numbers.formatInteger(t.basePrice, 1, 'POINT')} ${#messages.msg('common.currency')}|">
                                            0 ₫
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="${t.active} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${t.active} ? #{admin.status.active} : #{admin.status.inactive}">
                                                Trạng thái
                                            </span>
                                        </td>
                                        <td class="text-end">
                                            <a class="btn btn-sm btn-outline-secondary"
                                               th:href="@{/admin/tours/{id}/view(id=${t.id})}"
                                               th:title="#{admin.action.view}">
                                                <i class="bi bi-eye"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<th:block th:replace="~{admin/fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
