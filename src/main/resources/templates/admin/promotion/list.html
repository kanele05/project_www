<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-layout :: head(#{admin.promotion.title})}"></head>
<body>

<nav th:replace="~{admin/fragments/admin-layout :: topbar}"></nav>

<div class="admin-shell">
    <div class="admin-grid">
        <aside class="admin-aside">
            <div th:replace="~{admin/fragments/admin-layout :: sidebar('promotions')}"></div>
        </aside>

        <main class="admin-main">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0" th:text="#{admin.promotion.title}">Quản lý mã khuyến mãi</h1>
                <a class="btn btn-primary" th:href="@{/admin/promotions/form}">
                    <i class="bi bi-plus-lg"></i> <span th:text="#{admin.action.new}">Thêm mới</span>
                </a>
            </div>

            <div th:replace="~{fragments/components :: alerts}"></div>

            <form class="row g-2 mb-3" method="get" th:action="@{/admin/promotions}">
                <div class="col-md-5">
                    <input class="form-control form-control-sm" type="search" name="keyword"
                           th:value="${keyword}" th:placeholder="#{admin.promotion.searchPlaceholder}">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" name="active" onchange="this.form.submit()">
                        <option value="" th:selected="${active == null}" th:text="#{admin.promotion.filterAll}">Tất cả</option>
                        <option value="true" th:selected="${active != null and active}"
                                th:text="#{admin.status.active}">Đang bật</option>
                        <option value="false" th:selected="${active != null and !active}"
                                th:text="#{admin.status.inactive}">Đang tắt</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-sm btn-outline-primary w-100" type="submit">
                        <i class="bi bi-search"></i> <span th:text="#{admin.action.search}">Tìm</span>
                    </button>
                </div>
            </form>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{admin.promotion.code}">Mã</th>
                            <th th:text="#{admin.promotion.name}">Tên chương trình</th>
                            <th th:text="#{admin.promotion.discount}">Giảm giá</th>
                            <th th:text="#{admin.promotion.period}">Hiệu lực</th>
                            <th th:text="#{admin.promotion.usage}">Lượt dùng</th>
                            <th th:text="#{admin.category.active}">Trạng thái</th>
                            <th class="text-end">&nbsp;</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${promotionsPage.empty}">
                            <td colspan="7" class="text-center text-muted py-4"
                                th:text="#{admin.empty}">Chưa có dữ liệu.</td>
                        </tr>

                        <tr th:each="p : ${promotionsPage.content}">
                            <td class="fw-semibold" th:text="${p.code}">MA</td>
                            <td class="small" th:text="${p.name}">Tên</td>
                            <td class="small">
                                <span th:if="${p.discountType.name() == 'PERCENT'}"
                                      th:text="|${#numbers.formatDecimal(p.discountValue, 1, 0)}%|">10%</span>
                                <span th:unless="${p.discountType.name() == 'PERCENT'}"
                                      th:text="|${#numbers.formatInteger(p.discountValue, 1, 'POINT')} ${#messages.msg('common.currency')}|">0 đ</span>
                            </td>
                            <td class="small text-muted">
                                <span th:text="${#temporals.format(p.startAt, 'dd/MM/yyyy')}">01/01/2026</span>
                                &rarr;
                                <span th:text="${#temporals.format(p.endAt, 'dd/MM/yyyy')}">01/01/2026</span>
                            </td>
                            <td class="small">
                                <span th:text="${p.usedCount}">0</span> /
                                <span th:text="${p.usageLimit != null ? p.usageLimit : '∞'}">∞</span>
                                <a class="ms-1" th:href="@{/admin/promotions/{id}/usages(id=${p.id})}"
                                   th:title="#{admin.promotion.viewUsages}">
                                    <i class="bi bi-list-ul"></i>
                                </a>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${p.active} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${p.active} ? #{admin.status.active} : #{admin.status.inactive}">Trạng thái</span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/admin/promotions/form(id=${p.id})}">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form class="d-inline" method="post"
                                      th:action="@{/admin/promotions/{id}/toggle-active(id=${p.id})}">
                                    <button class="btn btn-sm btn-outline-warning" type="submit">
                                        <i class="bi" th:classappend="${p.active} ? 'bi-eye-slash' : 'bi-eye'"></i>
                                    </button>
                                </form>
                                <!--/* Bấm xoá một mã đã có lượt dùng sẽ bị tầng service chặn lại
                                       kèm thông báo tiếng Việt và gợi ý "Vô hiệu hoá mã", chứ
                                       không phải lỗi khoá ngoại. */-->
                                <form class="d-inline" method="post"
                                      th:action="@{/admin/promotions/{id}/delete(id=${p.id})}"
                                      th:data-ajax-delete="@{/api/admin/promotions/{id}(id=${p.id})}"
                                      th:data-confirm="#{admin.confirmDelete}">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{fragments/components :: pagination(${promotionsPage}, ${pageUrlPrefix})}"></div>
        </main>
    </div>
</div>

<th:block th:replace="~{admin/fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
