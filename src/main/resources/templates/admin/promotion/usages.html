<!DOCTYPE html>
<!--
  Lịch sử dùng một mã khuyến mãi (UC019): ai đã dùng, đơn nào, giảm bao nhiêu.
  CouponUsageRepository.findByPromotionIdOrderByUsedAtDesc nạp sẵn user và
  booking bằng @EntityGraph, nên truy cập usage.user / usage.booking ở đây an
  toàn dù open-in-view đang tắt.
-->
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-layout :: head(#{admin.promotion.usagesTitle(${promotion.code})})}"></head>
<body>

<nav th:replace="~{admin/fragments/admin-layout :: topbar}"></nav>

<div class="admin-shell">
    <div class="admin-grid">
        <aside class="admin-aside">
            <div th:replace="~{admin/fragments/admin-layout :: sidebar('promotions')}"></div>
        </aside>

        <main class="admin-main">

            <nav aria-label="breadcrumb">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item">
                        <a th:href="@{/admin/promotions}" th:text="#{admin.promotion.title}">Quản lý mã khuyến mãi</a>
                    </li>
                    <li class="breadcrumb-item active" th:text="${promotion.code}">MA</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 mb-0" th:text="#{admin.promotion.usagesTitle(${promotion.code})}">Lượt dùng mã</h1>
                <span class="text-muted small">
                    <span th:text="${promotion.usedCount}">0</span> /
                    <span th:text="${promotion.usageLimit != null ? promotion.usageLimit : '∞'}">∞</span>
                    <span th:text="#{admin.promotion.usage}">lượt</span>
                </span>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{admin.promotion.usage.user}">Khách hàng</th>
                            <th th:text="#{admin.promotion.usage.booking}">Đơn</th>
                            <th class="text-end" th:text="#{admin.promotion.usage.discount}">Số tiền giảm</th>
                            <th th:text="#{admin.promotion.usage.usedAt}">Thời điểm dùng</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${usagesPage.empty}">
                            <td colspan="4" class="text-center text-muted py-4"
                                th:text="#{admin.empty}">Chưa có dữ liệu.</td>
                        </tr>
                        <tr th:each="u : ${usagesPage.content}">
                            <td>
                                <div class="fw-semibold" th:text="${u.user.fullName}">Họ tên</div>
                                <div class="small text-muted" th:text="${u.user.email}">email</div>
                            </td>
                            <td>
                                <a th:href="@{/admin/bookings/{code}(code=${u.booking.code})}"
                                   th:text="${u.booking.code}">TB...</a>
                            </td>
                            <td class="text-end fw-semibold text-danger"
                                th:text="|${#numbers.formatInteger(u.discountAmount, 1, 'POINT')} ${#messages.msg('common.currency')}|">0 đ</td>
                            <td class="small text-muted"
                                th:text="${#temporals.format(u.usedAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:replace="~{fragments/components :: pagination(${usagesPage}, ${pageUrlPrefix})}"></div>

            <a class="btn btn-link text-decoration-none mt-2" th:href="@{/admin/promotions}"
               th:text="#{admin.action.backToList}">&larr; Quay lại danh sách</a>
        </main>
    </div>
</div>

<th:block th:replace="~{admin/fragments/admin-layout :: scripts}"></th:block>
</body>
</html>
