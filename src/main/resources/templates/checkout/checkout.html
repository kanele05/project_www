<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{checkout.title})}"></head>
<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout :: header(false)}"></header>

<main class="container my-4 flex-grow-1">

    <h1 class="h3 mb-3">
        <i class="bi bi-credit-card"></i> <span th:text="#{checkout.title}">Thông tin đặt tour</span>
    </h1>

    <div th:replace="~{fragments/components :: alerts}"></div>

    <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post">
        <div class="row g-4">

            <div class="col-lg-7">
                <div class="panel">
                    <div class="panel__pad">
                        <h2 class="h6 mb-1" th:text="#{checkout.contact}">Thông tin liên hệ</h2>
                        <p class="small text-muted" th:text="#{checkout.prefillNote}">Ghi chú</p>

                        <div class="mb-3">
                            <label class="form-label" for="customerName"
                                   th:text="#{checkout.name}">Người liên hệ</label>
                            <input class="form-control" type="text" id="customerName"
                                   th:field="*{customerName}" th:errorclass="is-invalid" required>
                            <div class="invalid-feedback" th:errors="*{customerName}">Lỗi</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-7 mb-3">
                                <label class="form-label" for="customerEmail"
                                       th:text="#{checkout.email}">Email</label>
                                <input class="form-control" type="email" id="customerEmail"
                                       th:field="*{customerEmail}" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:errors="*{customerEmail}">Lỗi</div>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label class="form-label" for="customerPhone"
                                       th:text="#{checkout.phone}">Số điện thoại</label>
                                <input class="form-control" type="tel" id="customerPhone"
                                       th:field="*{customerPhone}" th:errorclass="is-invalid" required>
                                <div class="invalid-feedback" th:errors="*{customerPhone}">Lỗi</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="customerAddress"
                                   th:text="#{checkout.address}">Địa chỉ</label>
                            <input class="form-control" type="text" id="customerAddress"
                                   th:field="*{customerAddress}" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{customerAddress}">Lỗi</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="paymentMethod"
                                   th:text="#{checkout.paymentMethod}">Hình thức thanh toán</label>
                            <select class="form-select" id="paymentMethod"
                                    th:field="*{paymentMethod}" th:errorclass="is-invalid">
                                <option th:value="#{checkout.payment.bank}"
                                        th:text="#{checkout.payment.bank}">Chuyển khoản</option>
                                <option th:value="#{checkout.payment.cash}"
                                        th:text="#{checkout.payment.cash}">Tại văn phòng</option>
                                <option th:value="#{checkout.payment.momo}"
                                        th:text="#{checkout.payment.momo}">MoMo</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{paymentMethod}">Lỗi</div>
                        </div>

                        <div class="mb-0">
                            <label class="form-label" for="note"
                                   th:text="#{checkout.note}">Ghi chú</label>
                            <textarea class="form-control" id="note" rows="3"
                                      th:field="*{note}" th:errorclass="is-invalid"
                                      th:placeholder="#{checkout.note.placeholder}"></textarea>
                            <div class="invalid-feedback" th:errors="*{note}">Lỗi</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="panel">
                    <div class="panel__pad">
                        <h2 class="h6 mb-3" th:text="#{checkout.summary}">Đơn hàng của bạn</h2>

                        <div class="d-flex justify-content-between small border-bottom py-2"
                             th:each="item : ${cart.items}">
                            <div class="pe-2">
                                <div class="fw-semibold" th:text="${item.tourName}">Tên tour</div>
                                <div class="text-muted">
                                    <span th:text="${#temporals.format(item.departureDate, 'dd/MM/yyyy')}">01/01/2026</span>
                                    &middot;
                                    <span th:text="${item.numAdults}">1</span>
                                    <span th:text="#{common.adults}">người lớn</span>
                                    <span th:if="${item.numChildren > 0}">
                                        , <span th:text="${item.numChildren}">0</span>
                                        <span th:text="#{common.children}">trẻ em</span>
                                    </span>
                                </div>
                            </div>
                            <div class="text-nowrap fw-semibold"
                                 th:text="|${#numbers.formatInteger(item.subtotal, 1, 'POINT')} ${#messages.msg('common.currency')}|">
                                0 ₫
                            </div>
                        </div>

                        <div class="mt-3 pt-3 border-top" data-coupon-box>
                            <label class="form-label small fw-semibold" for="couponCode"
                                   th:text="#{checkout.coupon.label}">Mã giảm giá</label>
                            <div class="input-group input-group-sm">
                                <input class="form-control text-uppercase" id="couponCode"
                                       th:field="*{couponCode}"
                                       th:placeholder="#{checkout.coupon.placeholder}"
                                       autocomplete="off">
                                <button class="btn btn-outline-secondary" type="button"
                                        data-coupon-apply
                                        th:text="#{checkout.coupon.apply}">Áp dụng</button>
                            </div>
                            <div class="form-text" data-coupon-message></div>
                        </div>

                        <div class="d-flex justify-content-between small mt-2 d-none"
                             data-coupon-discount-row>
                            <span th:text="#{checkout.coupon.discount}">Giảm giá</span>
                            <span class="fw-semibold text-success" data-coupon-discount>0 ₫</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fw-semibold" th:text="#{common.total}">Tổng cộng</span>
                            <span class="fs-4 fw-bold text-danger" data-coupon-total
                                  th:text="|${#numbers.formatInteger(cart.totalAmount, 1, 'POINT')} ${#messages.msg('common.currency')}|">
                                0 ₫
                            </span>
                        </div>

                        <button class="btn btn-primary w-100 mt-3" type="submit">
                            <i class="bi bi-check2-circle"></i>
                            <span th:text="#{checkout.submit}">Xác nhận đặt tour</span>
                        </button>
                        <a class="btn btn-link w-100 mt-1 text-decoration-none" th:href="@{/cart}"
                           th:text="#{common.back}">Quay lại</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4 mt-0">
            <div class="col-12">
                <div class="panel">
                    <div class="panel__pad">
                        <h2 class="h6 mb-1" th:text="#{checkout.passengers.title}">Danh sách hành khách</h2>
                        <p class="small text-muted" th:text="#{checkout.passengers.hint}">Ghi chú</p>

                        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi</div>
                        </div>

                        <div th:each="item, itemStat : ${cart.items}"
                             th:class="${itemStat.last} ? 'mb-0' : 'mb-4 pb-4 border-bottom'">
                            <h3 class="h6 mb-3">
                                <span th:text="${item.tourName}">Tên tour</span>
                                <span class="small text-muted fw-normal">
                                    (<span th:text="${#temporals.format(item.departureDate, 'dd/MM/yyyy')}">01/01/2026</span>)
                                </span>
                            </h3>
                            <input type="hidden" th:field="*{passengerGroups[__${itemStat.index}__].departureId}">

                            <div class="border rounded p-3 mb-3"
                                 th:each="p, pStat : *{passengerGroups[__${itemStat.index}__].adults}">
                                <p class="small fw-semibold text-uppercase text-muted mb-2"
                                   th:text="#{checkout.passengers.adultLabel(${pStat.count})}">Người lớn 1</p>
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.name}">Họ tên</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].fullName}"
                                               th:errorclass="is-invalid" required maxlength="100">
                                        <div class="invalid-feedback"
                                             th:errors="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].fullName}">Lỗi</div>
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.gender}">Giới tính</label>
                                        <select class="form-select form-select-sm"
                                                th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].gender}">
                                            <option value="">---</option>
                                            <option th:each="g : ${T(vn.edu.iuh.fit.tourbooking.entity.Gender).values()}"
                                                    th:value="${g}" th:text="#{${g.messageKey}}">Giới tính</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.birthDate}">Ngày sinh</label>
                                        <input class="form-control form-control-sm" type="date"
                                               th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].birthDate}"
                                               th:errorclass="is-invalid"
                                               th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                                        <div class="invalid-feedback"
                                             th:errors="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].birthDate}">Lỗi</div>
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.idNumber}">CCCD/Hộ chiếu</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].idNumber}"
                                               maxlength="30">
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.phone}">Điện thoại</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].phone}"
                                               maxlength="20">
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check form-check-inline mt-1">

                                            <label class="form-check-label small">
                                                <input class="form-check-input" type="checkbox"
                                                       th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].singleRoom}">
                                                <span th:text="#{passenger.column.singleRoom}">Phòng đơn</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.note}">Ghi chú</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].adults[__${pStat.index}__].note}"
                                               maxlength="255">
                                    </div>
                                </div>
                            </div>

                            <div class="border rounded p-3 mb-3"
                                 th:each="p, pStat : *{passengerGroups[__${itemStat.index}__].children}">
                                <p class="small fw-semibold text-uppercase text-muted mb-2"
                                   th:text="#{checkout.passengers.childLabel(${pStat.count})}">Trẻ em 1</p>
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.name}">Họ tên</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].fullName}"
                                               th:errorclass="is-invalid" required maxlength="100">
                                        <div class="invalid-feedback"
                                             th:errors="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].fullName}">Lỗi</div>
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.gender}">Giới tính</label>
                                        <select class="form-select form-select-sm"
                                                th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].gender}">
                                            <option value="">---</option>
                                            <option th:each="g : ${T(vn.edu.iuh.fit.tourbooking.entity.Gender).values()}"
                                                    th:value="${g}" th:text="#{${g.messageKey}}">Giới tính</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.birthDate}">Ngày sinh</label>
                                        <input class="form-control form-control-sm" type="date"
                                               th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].birthDate}"
                                               th:errorclass="is-invalid"
                                               th:max="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                                        <div class="invalid-feedback"
                                             th:errors="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].birthDate}">Lỗi</div>
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.idNumber}">CCCD/Hộ chiếu</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].idNumber}"
                                               maxlength="30">
                                    </div>
                                    <div class="col-md-2 col-6">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.phone}">Điện thoại</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].phone}"
                                               maxlength="20">
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check form-check-inline mt-1">
                                            <label class="form-check-label small">
                                                <input class="form-check-input" type="checkbox"
                                                       th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].singleRoom}">
                                                <span th:text="#{passenger.column.singleRoom}">Phòng đơn</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small mb-0" th:text="#{passenger.column.note}">Ghi chú</label>
                                        <input class="form-control form-control-sm" type="text"
                                               th:field="*{passengerGroups[__${itemStat.index}__].children[__${pStat.index}__].note}"
                                               maxlength="255">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
