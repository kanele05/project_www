# =============================================================================
#  English messages
#
#  Every key here mirrors messages.properties (the Vietnamese default). If a key
#  is missing from this file, Spring falls back to messages.properties and the
#  Vietnamese sentence shows through - so a missing translation is visible, not
#  silent.
#
#  Read as UTF-8 (spring.messages.encoding in application.yml), so accented
#  characters can be typed directly - no \uXXXX escapes needed.
# =============================================================================

