# --- Business rule errors -----------------------------------------------------
# Note: {0,number,#} rather than {0}. With plain {0}, MessageFormat treats the
# argument as a number and inserts grouping separators - tour id 99999 would show
# up as "99,999", looking like an amount of money instead of an identifier.
error.cart.tourNotFound=The tour you picked was not found (id {0,number,#}).
error.cart.departureNotFound=The departure you picked was not found (id {0,number,#}).
