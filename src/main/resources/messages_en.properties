# --- About page ---------------------------------------------------------------
about.title=About
about.eyebrow=About us
about.heading=We sell journeys, not brochures
about.lead=Every journey on this site comes with a day-by-day itinerary, separate adult and child pricing, and a live count of the seats left.
about.postcard=Vietnam

about.story.eyebrow=The story
about.story.title=Why this website exists
about.story.p1=Booking a trip ought to be the fun part, yet most of the time goes into phoning to ask whether seats are left, texting to ask the child fare, and then waiting to hear back.
about.story.p2=We built this site so every one of those questions is already answered on screen: each departure states the dates, the price per traveller type and the seats remaining. Booking holds your seats immediately - no manual confirmation queue.
about.story.p3=The rest - advice, arrangements, being there on the road - is still human work. Software should only handle the mechanical part.

about.values.eyebrow=Principles
about.values.title=Four things we do not compromise on
about.values.lead=These principles drove how the system was designed. They are not slogans on a wall.
about.values.1.title=Transparent pricing
about.values.1.text=The price on the site is the final price. Children have their own rate, stated right next to the adult one.
about.values.2.title=Small groups
about.values.2.text=Each departure has a hard seat limit in the system. When it is full, it is full.
about.values.3.title=Travel responsibly
about.values.3.text=We favour local operators and destinations that can carry the visitors, rather than piling everyone into the same few overloaded spots.
about.values.4.title=With you on the road
about.values.4.text=Every booking has a reference code and a named contact, so there is always someone to call.

about.lines.eyebrow=Tour lines
about.lines.title=What we currently run

about.process.title=How booking works
about.process.lead=The whole process fits in a browser, from finding a tour to receiving the confirmation email.

about.project.eyebrow=Context
about.project.title=About this project
about.project.text=The site is built with Spring Boot, Spring MVC, Spring Data JPA, Spring Security and Thymeleaf, storing data in SQL Server. The interface uses Bootstrap with a custom palette and layout; search suggestions, add-to-cart and the revenue chart all run over the application own REST web services via AJAX.
about.project.disclosure=This is a term project for the Web Programming (Java) course at the Faculty of Information Technology, Industrial University of Ho Chi Minh City. The brand, the tour data and the customer feedback are all illustrative - this is not a real travel company and it accepts no payments.

about.contact.title=Contact
about.contact.course=Web Programming (Java) - Faculty of IT, IUH

