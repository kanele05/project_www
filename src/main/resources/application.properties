# ============================================================
# Cấu hình ứng dụng TourBooking (Spring Boot 3.5)
# Mọi giá trị dạng ${BIEN:mac-dinh} đều ghi đè được bằng biến môi trường.
# ============================================================

# ---------- Ứng dụng & hồ sơ (profile) ----------
spring.application.name=tourbooking
spring.profiles.default=dev

# ---------- Nguồn dữ liệu (SQL Server) ----------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TourBookingDB;encrypt=true;trustServerCertificate=true;loginTimeout=30
spring.datasource.username=tourapp
spring.datasource.password=Tour@2026#IUH
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=TourBookingHikariPool

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.use_nationalized_character_data=true

spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---------- Thymeleaf & thông điệp i18n ----------
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8

spring.messages.fallback-to-system-locale=false

# ---------- Tải tệp lên ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ---------- HTTP client (RestClient dùng cho Spring AI) ----------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s

# ---------- Spring AI (Gemini qua starter OpenAI) ----------
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.retry.max-attempts=3
spring.ai.retry.on-http-codes=429
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=15s
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=${app.ai.base-url}
spring.ai.openai.chat.completions-path=${app.ai.chat-path}
spring.ai.openai.chat.options.model=${app.ai.chat-model}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.embeddings-path=${app.ai.embeddings-path}
spring.ai.openai.embedding.options.model=${app.ai.embedding-model}
spring.ai.openai.embedding.options.dimensions=${app.ai.embedding-dimensions:}

# ---------- Gửi email (SMTP) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Cấu hình riêng của ứng dụng (tiền tố app.) ----------
# Tải ảnh lên
app.upload.dir=${user.dir}/uploads
app.upload.url-prefix=/uploads

# Email: mode=console chỉ in ra log, không gửi thật
app.mail.mode=console
app.mail.from=${MAIL_FROM:khanglehoang2602@gmail.com}
app.mail.from-name=IUH Tour Booking

# Trợ lý AI: để trống app.ai.enabled = tự bật khi có GEMINI_API_KEY
app.ai.enabled=${AI_ENABLED:}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.chat-path=${AI_CHAT_PATH:/v1beta/openai/chat/completions}
app.ai.embeddings-path=${AI_EMBEDDINGS_PATH:/v1beta/openai/embeddings}
app.ai.chat-model=${AI_CHAT_MODEL:gemini-2.5-flash}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:gemini-embedding-001}
app.ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:}
app.ai.embedding-min-interval-ms=${AI_EMBEDDING_MIN_INTERVAL_MS:700}
app.ai.vector-store-path=${AI_VECTOR_STORE_PATH:data/vector-store.json}
app.ai.similarity-threshold=${AI_SIMILARITY_THRESHOLD:0.5}
app.ai.search-top-k=30
app.ai.rag-top-k=4
app.ai.memory-messages=20
app.ai.chat-per-minute=8
app.ai.max-message-length=500

# Theo dõi hành vi người dùng (user_events)
app.tracking.enabled=true
app.tracking.max-events-per-minute=60
app.tracking.min-duration-ms=500
app.tracking.max-duration-ms=1800000
app.tracking.retention-days=180

# Quy tắc đặt tour (đơn vị: ngày / giờ / phần trăm)
app.booking.cutoff-days=2

app.booking.pending-expiry-hours=24

app.booking.self-cancel-min-days=3

app.booking.full-refund-min-days=7

app.booking.partial-refund-percent=50

# ---------- Máy chủ ----------
server.port=${PORT:8081}
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.timeout=30m
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------- Ghi log ----------
logging.level.vn.edu.iuh.fit.tourbooking=DEBUG

logging.charset.console=UTF-8
logging.charset.file=UTF-8
