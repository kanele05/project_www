spring:
  datasource:
    url: jdbc:h2:mem:tourbooking;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  thymeleaf:
    cache: false
app:
  upload:
    dir: ${java.io.tmpdir}/tourbooking-test-uploads
  mail:
    mode: console
