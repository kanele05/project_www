# Hồ sơ "h2" dành cho kiểm thử: CSDL H2 trong bộ nhớ, giả lập SQL Server.

# ---------- Nguồn dữ liệu ----------
spring.datasource.url=jdbc:h2:mem:tourbooking;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---------- JPA ----------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Cấu hình riêng của ứng dụng ----------
app.upload.dir=${java.io.tmpdir}/tourbooking-test-uploads
app.mail.mode=console
